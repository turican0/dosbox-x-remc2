# Testovaci body - overeni podezrelych alokaci v sub_10CB5 (orion_part_01.c)
# Kolo 2: eip: watche z kola 1 nic nechytly -> runtime adresy hry jsou
# posunute vuci IDA dumpu. Kalibrace pres hranove EAX watche: distinktivni
# velikosti alokaci (0x1B5030 = 1790000 atd.) chytneme nezavisle na
# adresach a EIP zaznamu nam posun prozradi.
OUTPUT file=dosbox_trace_alloc.txt

# konstanta znama z vlny 06 (GameMain: PoolAlloc(0x64000)) - kalibracni kotva
DUMPREGS cond=eax:0x64000  label=c_0x64000_400KB

# podezrele "adresy" ze sub_10CB5
DUMPREGS cond=eax:0x1B5030 label=c_1790000_unk_1B5030
DUMPREGS cond=eax:0x1608A  label=c_90250_loc_16085p5
DUMPREGS cond=eax:0x3E800  label=c_256000_loc_3E7FBp5
DUMPREGS cond=eax:0x1B5418 label=c_1791000_unk_1B5418

# nesporne konstanty ze stejne funkce - potvrzeni sekvence
DUMPREGS cond=eax:0x7530   label=c_30000
DUMPREGS cond=eax:0x17E8   label=c_6120
DUMPREGS cond=eax:0x7548   label=c_30024
DUMPREGS cond=eax:0x174508 label=c_1525000

# Auto-exit: sub_10CB5 alokace probehly v ~83M cyklu (overeno behem 2),
# 120M da rezervu - dosbox se pak sam ukonci a nebezi donekonecna.
STOP cond=cycle_ge:120000000
